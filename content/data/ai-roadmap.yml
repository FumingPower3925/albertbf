# The AI knowledge tree: every branch of learning-based AI except computer
# vision and robotics, as structured courses only. Generated once from the
# source map, then hand-edited.
#
# status: todo | doing | done   (public, shown on the page)
# rating: 1-5                   (optional, only meaningful once status is done)
# verdict: markdown            (optional, a couple of sentences)
# alt_of: <slug>                (optional, points to another course in the same
#                                domain that this one is a genuine substitute for
#                                — pick one, not both)
# builds_on_course: <slug>      (optional, points to a course this one continues
#                                from as a sequel or real prerequisite)
# effort: "..."                  (optional, expected workload: the provider's
#                                stated weeks x hrs/week or total hours, a
#                                credit-unit figure plus the institution's
#                                published hours-per-unit rule, or a lecture /
#                                episode count when that is all the official
#                                source gives; omit when nothing official exists)
#
# reviewed: YYYY-MM-DD          (when every entry was last checked against its
#                                official page; shown on the page)
#
# A domain may carry a `note` (inline markdown) for what its entries alone
# cannot say: where a topic is only taught inside a broader course, or what no
# structured course covers yet.
---
title: The AI knowledge tree
reviewed: 2026-10-04
lede: >-
  Every branch of learning-based AI except computer vision and robotics, as
  structured courses only: no articles, no blog posts, no "read this repo". Ten
  tiers ordered by dependency, each one stating what it builds on. Within a tier
  the domains are siblings and can be taken in any order.
note: >-
  Every entry names the course, the institution, and its code and edition where
  they matter, so it resolves to exactly one thing, plus its expected workload
  where the provider states one. Genuine substitutes form a "pick one" group;
  dominated courses are left out. Computer vision and robotics are deliberately
  out of scope.
